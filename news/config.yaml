name: "Onet News"
version: "1.2.2"
slug: "onet_news"
description: >-
  Web scraping najciekawszych artykułów z Onet.pl i WP.pl (ranking +
  wiadomości pilne z obu źródeł), udostępniane do Home Assistant przez
  interfejs REST API. Źródła można włączać/wyłączać w opcjach.
url: "https://github.com/ravek71/HA_News"
arch:
  - amd64
  - aarch64
image: "ghcr.io/ravek71/onet-news"
startup: application
boot: auto
ports:
  8099/tcp: 8080
ingress: true
options:
  interval_minutes: 10
  max_articles: 60
  log_level: "info"
  enable_onet: true
  enable_wp: true
schema:
  interval_minutes: int(1,1440)
  max_articles: int(10,500)
  log_level: list(debug|info|warning|error)
  enable_onet: bool
  enable_wp: bool
watchdog: "http://[HOST]:[PORT:8080]/healthz"
panel_icon: mdi:newspaper-variant-outline
panel_title: "Onet News"
